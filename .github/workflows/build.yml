name: Build mesen-gdb

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; only the release job writes.
permissions:
  contents: read

env:
  SDL_VERSION: 2.30.12
  # SDL2-devel-2.30.12-mingw.tar.gz from SDL's GitHub release. SDL publishes
  # no checksum for it; this is the copy the Windows build was tested with.
  SDL_MINGW_SHA256: dddafbf0705a8cbe1f97c69680886ce147ed4d38f1d04e03523681298e081b0f

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qy
          sudo apt-get install -qy libsdl2-dev ccache

      - uses: ./.github/actions/setup-ccache-action
        with:
          key: ccache-linux

      - name: Build
        run: make -j$(nproc) CXX="ccache clang++" CC="ccache clang"

      - name: Unit tests
        run: make test CXX="ccache clang++" CC="ccache clang"

      # --help exits 2 by design (steps run with pipefail); the usage text
      # shows the binary starts.
      - name: Starts
        run: "{ bin/linux-x64/Release/mesen-gdb --help 2>&1 || true; } | grep -q -- --headless"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python driver tests
        run: |
          pip install -e "python[test]"
          pytest python/tests

      - uses: actions/upload-artifact@v4
        with:
          name: mesen-gdb-linux-x64
          path: bin/linux-x64/Release/mesen-gdb

  windows:
    # Cross-compiled with MinGW-w64; the tests run under Wine.
    runs-on: ubuntu-24.04
    env:
      WINEDEBUG: -all
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qy
          # -posix: the core needs std::thread, which the win32 thread model lacks.
          sudo apt-get install -qy --no-install-recommends g++-mingw-w64-x86-64-posix wine wine64 ccache

      - name: Cache SDL
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdl-download
          key: sdl2-mingw-${{ env.SDL_VERSION }}

      - name: Fetch SDL
        run: |
          mkdir -p "$RUNNER_TEMP/sdl-download"
          cd "$RUNNER_TEMP/sdl-download"
          file=SDL2-devel-$SDL_VERSION-mingw.tar.gz
          [ -f "$file" ] || curl -sSfLO "https://github.com/libsdl-org/SDL/releases/download/release-$SDL_VERSION/$file"
          echo "$SDL_MINGW_SHA256  $file" | sha256sum -c -
          tar -xzf "$file" -C "$RUNNER_TEMP"
          echo "SDL2_PREFIX=$RUNNER_TEMP/SDL2-$SDL_VERSION/x86_64-w64-mingw32" >> "$GITHUB_ENV"
          echo "WINEPREFIX=$RUNNER_TEMP/wine" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-ccache-action
        with:
          key: ccache-windows

      - name: Build
        run: make -j$(nproc) TARGET=windows CXX="ccache x86_64-w64-mingw32-g++-posix" CC="ccache x86_64-w64-mingw32-gcc-posix"

      # One self-contained .exe: SDL and the MinGW runtime are linked in.
      - name: Only system DLLs
        run: |
          dlls=$(x86_64-w64-mingw32-objdump -p bin/windows-x64/Release/mesen-gdb.exe | sed -n 's/.*DLL Name: //p')
          echo "$dlls"
          if echo "$dlls" | grep -qiE 'sdl|libstdc|libgcc|winpthread'; then
            echo "::error::mesen-gdb.exe needs a DLL that is not part of Windows"
            exit 1
          fi

      - name: Unit tests
        run: make test TARGET=windows CXX="ccache x86_64-w64-mingw32-g++-posix" CC="ccache x86_64-w64-mingw32-gcc-posix"

      - name: Starts
        run: "{ wine bin/windows-x64/Release/mesen-gdb.exe --help 2>&1 || true; } | grep -q -- --headless"

      - uses: actions/upload-artifact@v4
        with:
          name: mesen-gdb-windows-x64
          path: bin/windows-x64/Release/mesen-gdb.exe

  macos:
    # Apple Silicon, with SDL linked in statically.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Cache SDL
        id: sdl-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdl2-static
          key: sdl2-static-macos-${{ hashFiles('tools/build-sdl2-static.sh') }}

      # Built from SDL's source (checked by SHA-256) for macOS 11 and later.
      - name: Build SDL
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: tools/build-sdl2-static.sh "$RUNNER_TEMP/sdl2-static"

      - name: Build
        run: make -j$(sysctl -n hw.logicalcpu) SDL2_PREFIX="$RUNNER_TEMP/sdl2-static"

      # One self-contained binary: nothing outside macOS itself.
      - name: Only system libraries
        run: |
          libs=$(otool -L bin/osx-arm64/Release/mesen-gdb | tail -n +2 | awk '{print $1}')
          echo "$libs"
          if echo "$libs" | grep -vE '^(/usr/lib/|/System/Library/)'; then
            echo "::error::mesen-gdb needs a library that is not part of macOS"
            exit 1
          fi

      - name: Unit tests
        run: make test SDL2_PREFIX="$RUNNER_TEMP/sdl2-static"

      - name: Starts
        run: "{ bin/osx-arm64/Release/mesen-gdb --help 2>&1 || true; } | grep -q -- --headless"

      # macOS only allows windows on the main thread: open one (no ROM
      # needed) and check the session survives it.
      - name: Opens its window
        run: python3 tools/check-dap-window.py bin/osx-arm64/Release/mesen-gdb

      # A ROM in the window: without --headless, a CLI session that cannot
      # open SDL exits 2 instead of running headless.
      - name: Runs a ROM in its window
        run: bin/osx-arm64/Release/mesen-gdb tests/roms/green/green.sfc --script tests/roms/green/screen-is-green

      - uses: actions/upload-artifact@v4
        with:
          name: mesen-gdb-macos-arm64
          path: bin/osx-arm64/Release/mesen-gdb

      # A crash leaves its report here; it is the backtrace we cannot get
      # any other way without a Mac.
      - name: Crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-crash-reports
          path: ~/Library/Logs/DiagnosticReports/
          if-no-files-found: ignore

  # Pushing a v* tag (git tag v1.2.0 && git push origin v1.2.0) publishes
  # both binaries as a GitHub Release once the builds and tests pass. A tag
  # with a hyphen (v1.2.0-rc1) makes a prerelease.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Artifacts lose the executable bit; a tarball keeps it for Linux.
      - name: Package
        run: |
          mkdir dist
          chmod +x artifacts/mesen-gdb-linux-x64/mesen-gdb artifacts/mesen-gdb-macos-arm64/mesen-gdb
          tar -czf dist/mesen-gdb-$GITHUB_REF_NAME-linux-x64.tar.gz -C artifacts/mesen-gdb-linux-x64 mesen-gdb
          tar -czf dist/mesen-gdb-$GITHUB_REF_NAME-macos-arm64.tar.gz -C artifacts/mesen-gdb-macos-arm64 mesen-gdb
          (cd artifacts/mesen-gdb-windows-x64 && zip -q ../../dist/mesen-gdb-$GITHUB_REF_NAME-windows-x64.zip mesen-gdb.exe)
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $prerelease \
            --notes "The Linux build needs SDL2 installed (libsdl2-2.0-0 on Debian/Ubuntu). The Windows .exe and the macOS (Apple Silicon, macOS 11+) binary are self-contained. macOS quarantines an unsigned download: run \`xattr -d com.apple.quarantine mesen-gdb\` once."
