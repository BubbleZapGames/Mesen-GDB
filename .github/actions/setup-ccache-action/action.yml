name: 'Setup CCache'
# The job puts ccache in front of its compilers itself (CXX="ccache ...").
inputs:
  key:
    description: 'Cache key, one per job'
    required: true
runs:
  using: "composite"
  steps:
      - name: Setup CCache
        shell: bash
        run: |
          cat <<EOF >>"$GITHUB_ENV"
          CCACHE_MAXSIZE=500M
          CCACHE_DIR=$HOME/.cache/ccache
          CCACHE_BASEDIR=$PWD
          EOF
      - name: Cache compilation
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ inputs.key }}-${{ github.sha }}
          restore-keys: |
            ${{ inputs.key }}-
